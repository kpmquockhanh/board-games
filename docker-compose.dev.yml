services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - backend-data:/data
    expose:
      - "8080"
    environment:
      - CGO_ENABLED=0
      - DB_PATH=/data/ping.db
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/hotpot/rooms"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_PROXY=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  sqlite-web:
    image: coleifer/sqlite-web
    ports:
      - "8081:8080"
    volumes:
      - backend-data:/data
    environment:
      - SQLITE_DATABASE=/data/ping.db
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
