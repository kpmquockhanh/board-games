services:
  backend:
    build: ./backend
    volumes:
      - backend-data:/data
    expose:
      - "8080"
    environment:
      - DB_PATH=/data/ping.db
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/hotpot/rooms"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
